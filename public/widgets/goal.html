<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>RoxenBot Cloud Goal Bar</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .goal-container {
      width: 480px;
      background: rgba(12, 16, 25, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 16px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .goal-header {
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .goal-track {
      width: 100%;
      height: 14px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    .goal-fill {
      height: 100%;
      background: linear-gradient(90deg, #53fc18, #00e59b);
      width: 45%;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(83, 252, 24, 0.5);
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body>

  <div class="goal-container">
    <div class="goal-header">
      <span id="goal-title">🎯 TAKİPÇİ HEDEFİ</span>
      <span id="goal-counts" style="color: #53fc18;">45 / 100 (%45)</span>
    </div>
    <div class="goal-track">
      <div id="goal-bar" class="goal-fill"></div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (token) {
      fetch(`/api/widget/data?token=${token}`)
        .then(r => r.json())
        .then(data => {
          if (data && data.widgets?.goal) {
            const g = data.widgets.goal;
            document.getElementById('goal-title').innerText = g.title || 'TAKİPÇİ HEDEFİ';
            const curr = g.current || 0;
            const target = g.target || 100;
            const pct = Math.min(Math.round((curr / target) * 100), 100);
            document.getElementById('goal-counts').innerText = `${curr} / ${target} (%${pct})`;
            document.getElementById('goal-bar').style.width = `${pct}%`;
          }
        });
    }
  </script>
</body>
</html>
